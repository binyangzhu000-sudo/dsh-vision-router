# Atlas Cloud（OpenAI 兼容网关，按量计费，需 Key；/v1/models 公开，模型名以官方列表为准）
llm-pi-ai:
  providers:
    atlascloud:
      api: openai-completions
      baseURL: https://api.atlascloud.ai/v1
      apiKeyEnv: ATLASCLOUD_API_KEY
      models:
        - id: qwen/qwen3.5-flash
          name: "Atlas Cloud: Qwen3.5 Flash"
          contextWindow: 1000000
          maxTokens: 8192
          input: [text, image]
        - id: google/gemini-3.1-flash-lite
          name: "Atlas Cloud: Gemini 3.1 Flash Lite"
          contextWindow: 1048576
          maxTokens: 8192
          input: [text, image]
